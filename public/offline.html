<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0b"><title>Offline — VOXELMIND XR</title><style>body{margin:0;background:#0a0a0b;color:#f2f2f2;font:16px system-ui}main{max-width:40rem;margin:8vh auto;padding:24px}a,button{color:#b6f23a;background:transparent;border:1px solid #555;padding:12px;display:inline-block;text-decoration:none;cursor:pointer}p{line-height:1.6}pre{white-space:pre-wrap}</style></head><body><main><img src="/favicon.svg" width="64" height="64" alt="VOXELMIND XR"><h1>Your world is still here</h1><p>The connection is unavailable. Reopen a previously cached studio to edit downloaded objects. AI and Cloud saving need a connection; missing models may appear as simple bounds.</p><a href="/studio">Reopen studio</a> <button id="retry">Retry connection</button> <button id="export">Export local world</button><p id="state" role="status"></p></main><script>document.getElementById('retry').onclick=()=>location.reload();document.getElementById('export').onclick=()=>{try{const r=JSON.parse(localStorage.getItem('voxelmind.current-world.v2')||'null');if(!r?.scene)throw Error('No local world found on this device.');const u=URL.createObjectURL(new Blob([JSON.stringify(r.scene,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='voxelmind-recovered-world.json';a.click();URL.revokeObjectURL(u)}catch(e){document.getElementById('state').textContent=e.message}};</script></body></html>
